<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exemplo — Notificações de compras</title>
<style>
  body{margin:0;font-family:Inter,system-ui,sans-serif;background:#F7F4EC;color:#24352C;line-height:1.6}
  main{max-width:720px;margin:0 auto;padding:48px 20px 120px}
  h1{font-size:1.75rem;line-height:1.2}
  .aviso{background:#FFF0C2;border:1px solid #F2B632;border-radius:12px;padding:12px 16px;font-size:.95rem}
  button{font:inherit;font-weight:600;padding:10px 16px;border-radius:10px;border:1px solid #244C38;background:#fff;color:#244C38;cursor:pointer;margin:4px 6px 4px 0}
  .fill{height:60vh}
</style>
</head>
<body>
<main>
  <h1>Notificações de compras — página de exemplo</h1>
  <p class="aviso"><strong>Modo demonstração:</strong> os nomes, cidades e compras exibidos aqui são <strong>fictícios</strong> (etiqueta DEMONSTRAÇÃO), apenas para testar o visual.</p>
  <p>
    <button id="btn-next">Mostrar próxima agora</button>
    <button id="btn-pause">Pausar</button>
    <button id="btn-resume">Retomar</button>
  </p>
  <p>Role a página e navegue normalmente: a notificação não bloqueia cliques fora dela.</p>
  <div class="fill"></div>
  <p>Fim da página de exemplo.</p>
</main>

<script src="notificacoes-compras.js"></script>
<script>
  /* Modo demo: dados fictícios com a etiqueta "Exemplo".
     Esta página é só para testes (allowDemo:true). No site público use:
       SalesNotifications.init({ mode: 'live', endpoint: 'https://SEU-DOMINIO/api/notificacoes-publicas' });  */
  var sn = SalesNotifications.init({ mode: 'demo', allowDemo: true, initialDelay: 1500 });
  document.getElementById('btn-next').onclick   = function () { sn.showNext(); };
  document.getElementById('btn-pause').onclick  = function () { sn.pause(); };
  document.getElementById('btn-resume').onclick = function () { sn.resume(); };
</script>
</body>
</html>
